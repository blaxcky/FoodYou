name: Build devRelease APK

on:
  push:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/food-you-debug.keystore"

      - name: Build devRelease APK
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/food-you-debug.keystore
        run: ./gradlew :app:assembleDevRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodYou-devRelease-${{ github.sha }}
          path: app/build/outputs/apk/devRelease/app-devRelease.apk
          retention-days: 14

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "devRelease-${GITHUB_SHA}" \
            app/build/outputs/apk/devRelease/app-devRelease.apk \
            --target "${GITHUB_SHA}" \
            --title "Development APK (${GITHUB_SHA::7})" \
            --notes "Automatisch erstellt aus Commit ${GITHUB_SHA}." \
            --prerelease
